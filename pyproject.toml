[project]
name = "screenscan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "av>=19.0.0",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "pyarrow>=25.0.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[tool.uv.sources]
# CUDA wheels on Linux only; macOS (Apple silicon, MPS) and Windows use the default PyPI wheels.
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
